name: deploy-research-specialist-sdk

# An example deployment, inert by default. It never runs on its own: it is
# started by hand, and only in a repository that has opted in by setting the
# DEPLOY_ENABLED variable and an `aws-production` environment. This repository
# sets neither. See docs/deploying.md for the AWS side.
#
# Chaining a deploy to CI with `workflow_run` is a common pattern and a common
# hole: for a fork pull request, `workflow_run.head_branch` is the *fork's*
# branch name, so a check on `head_branch == 'main'` alone lets a fork's code
# deploy with your cloud role. If you add that trigger, also require
# `workflow_run.event == 'push'` and
# `workflow_run.head_repository.full_name == github.repository`.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-research-specialist-sdk
  cancel-in-progress: false

env:
  AGENT_DIR: agents/research-specialist-sdk
  STACK_NAME: parivox-a2a-research-sdk
  ECR_REPOSITORY: parivox-a2a-research-sdk

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Required reviewers and a main-only branch rule belong on this environment,
    # and the AWS role's OIDC trust policy should name it in its `sub` condition.
    environment: aws-production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Validate deploy configuration
        # Account-identifying values are stored as environment *secrets*, not
        # variables, even though none of them is a credential. GitHub prints every
        # step's environment and the expanded command text in the job log; only
        # secrets are masked there, and on a public repository that log is public.
        run: |
          set -euo pipefail
          missing=false
          for name in AWS_REGION AWS_ROLE_TO_ASSUME A2A_VPC_ID A2A_SUBNET_IDS \
                      A2A_CLIENT_SECURITY_GROUP_ID A2A_RESEARCH_SDK_API_KEY_SECRET_ARN; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              echo "::error::Missing required setting: $name"
              missing=true
            fi
          done
          [ "$missing" = "false" ]
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          A2A_VPC_ID: ${{ secrets.A2A_VPC_ID }}
          A2A_SUBNET_IDS: ${{ secrets.A2A_SUBNET_IDS }}
          A2A_CLIENT_SECURITY_GROUP_ID: ${{ secrets.A2A_CLIENT_SECURITY_GROUP_ID }}
          A2A_RESEARCH_SDK_API_KEY_SECRET_ARN: ${{ secrets.A2A_RESEARCH_SDK_API_KEY_SECRET_ARN }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Mask the AWS account ID
        # The ECR registry hostname, every image URI and the stack outputs contain
        # the account ID. Read it at runtime so it never appears in the command
        # text, and mask it before any later step can print it.
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::${account}"

      - name: Ensure ECR repository exists
        # The repository is not part of the stack: the stack needs an image URI to
        # deploy, so the image has to exist first. Creating it here keeps that
        # ordering explicit instead of requiring a two-phase first deploy.
        run: |
          set -euo pipefail
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --image-scanning-configuration scanOnPush=true >/dev/null

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push image
        id: image
        run: |
          set -euo pipefail
          tag="${SOURCE_SHA:0:7}"
          uri="${REGISTRY}/${ECR_REPOSITORY}"
          docker build -t "${uri}:${tag}" -t "${uri}:latest" "$AGENT_DIR"
          docker push "${uri}:${tag}"
          docker push "${uri}:latest"
          echo "uri=${uri}:${tag}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}

      - name: Deploy stack
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file "$AGENT_DIR/infra/template.yaml" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ServiceName="$STACK_NAME" \
              VpcId="$A2A_VPC_ID" \
              SubnetIds="$A2A_SUBNET_IDS" \
              ClientSecurityGroupId="$A2A_CLIENT_SECURITY_GROUP_ID" \
              ContainerImageUri="$IMAGE_URI" \
              ApiKeySecretArn="$A2A_RESEARCH_SDK_API_KEY_SECRET_ARN" \
              OpenAiSecretArn="$A2A_RESEARCH_SDK_OPENAI_SECRET_ARN"
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          A2A_VPC_ID: ${{ secrets.A2A_VPC_ID }}
          A2A_SUBNET_IDS: ${{ secrets.A2A_SUBNET_IDS }}
          A2A_CLIENT_SECURITY_GROUP_ID: ${{ secrets.A2A_CLIENT_SECURITY_GROUP_ID }}
          A2A_RESEARCH_SDK_API_KEY_SECRET_ARN: ${{ secrets.A2A_RESEARCH_SDK_API_KEY_SECRET_ARN }}
          A2A_RESEARCH_SDK_OPENAI_SECRET_ARN: ${{ secrets.A2A_RESEARCH_SDK_OPENAI_SECRET_ARN }}

      - name: Verify the deployed task definition
        # A green deploy is not proof that the intended configuration landed:
        # verify against the task definition ECS actually runs.
        run: |
          set -euo pipefail
          actual="$(aws ecs describe-task-definition \
            --task-definition "$STACK_NAME" \
            --query 'taskDefinition.containerDefinitions[0].image' --output text)"
          echo "expected image: $IMAGE_URI"
          echo "deployed image: $actual"
          if [ "$IMAGE_URI" != "$actual" ]; then
            echo "::error::Deployed task definition does not reference the image just built."
            exit 1
          fi

          # The service must never be reachable from anything but the allowed
          # client security group (a2a-python #1159).
          sg="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ServiceSecurityGroupId'].OutputValue | [0]" \
            --output text)"
          open="$(aws ec2 describe-security-groups --group-ids "$sg" \
            --query 'SecurityGroups[0].IpPermissions[].IpRanges[].CidrIp' --output text)"
          if [ -n "$open" ]; then
            echo "::error::Service security group has CIDR ingress ($open); it must admit only the client security group."
            exit 1
          fi
          echo "Ingress is restricted to security-group sources only."
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
